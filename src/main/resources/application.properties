# Conexi\uFFFDn a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/refugio_mascotas
spring.datasource.username=carlos
spring.datasource.password=sql_carlos

# Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuraci\uFFFDn de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logs
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
